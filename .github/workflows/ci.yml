name: Smart Human Presence & Digital Twin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sensor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sensor/requirements-ci.txt

      - name: Check Python syntax
        run: python -m compileall -q sensor

      - name: Run automated tests
        run: |
          if [ -d sensor/tests ]; then
            python -m pytest sensor/tests
          elif [ -d tests ]; then
            python -m pytest tests
          else
            echo "No test directory found. Add automated tests."
            exit 1
          fi
